<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Runeterra Rumble</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Rubik:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0e14;
  --panel:#121826;
  --panel2:#0e1420;
  --line:#2a3244;
  --gold:#c8aa6e;
  --gold-bright:#f0e6d2;
  --text:#dfe6f2;
  --muted:#8b96ab;
  --danger:#e0393f;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{
  background:var(--bg);
  color:var(--text);
  font-family:'Rubik',sans-serif;
  overflow-x:hidden;
}
body::before{
  content:"";
  position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(600px 400px at 15% 10%, rgba(200,170,110,.07), transparent 70%),
    radial-gradient(700px 500px at 85% 90%, rgba(79,212,199,.05), transparent 70%),
    radial-gradient(500px 400px at 80% 15%, rgba(224,111,216,.05), transparent 70%);
}
#app,#loginScreen{position:relative;z-index:1}

/* ===== LOGIN ===== */
#loginScreen{
  min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;
}
.loginBox{
  width:100%;max-width:380px;background:var(--panel);
  border:1px solid var(--line);border-radius:8px;padding:36px 32px;
  box-shadow:0 20px 60px rgba(0,0,0,.5);
}
.logo{
  font-family:'Cinzel',serif;font-weight:900;text-align:center;
  font-size:32px;line-height:1.1;letter-spacing:.06em;
  background:linear-gradient(180deg,#f0e6d2 0%,#c8aa6e 55%,#8a6d3b 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  text-transform:uppercase;
}
.logoSub{
  text-align:center;color:var(--muted);font-size:12px;letter-spacing:.35em;
  text-transform:uppercase;margin-top:6px;
}
.loginBox form{margin-top:28px;display:flex;flex-direction:column;gap:14px}
.loginBox label{font-size:12px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.loginBox input{
  width:100%;margin-top:6px;padding:12px 14px;border-radius:6px;
  background:var(--panel2);border:1px solid var(--line);color:var(--text);
  font-family:'Rubik',sans-serif;font-size:15px;outline:none;
  transition:border-color .2s;
}
.loginBox input:focus{border-color:var(--gold)}
.btnGold{
  margin-top:10px;padding:13px;border:none;border-radius:6px;cursor:pointer;
  font-family:'Cinzel',serif;font-weight:700;font-size:16px;letter-spacing:.12em;
  text-transform:uppercase;color:#1a1206;
  background:linear-gradient(180deg,#f0e6d2,#c8aa6e 60%,#a8894e);
  box-shadow:0 4px 18px rgba(200,170,110,.25);
  transition:transform .12s, box-shadow .2s, filter .2s;
}
.btnGold:hover{filter:brightness(1.08);box-shadow:0 6px 26px rgba(200,170,110,.4)}
.btnGold:active{transform:translateY(1px)}
.btnGold:disabled{filter:grayscale(.7) brightness(.6);cursor:not-allowed;box-shadow:none}
.loginErr{color:var(--danger);font-size:13px;text-align:center;min-height:18px}

/* ===== APP ===== */
#app{display:none;min-height:100vh;flex-direction:column}
header{
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 24px;border-bottom:1px solid var(--line);
  background:rgba(10,14,20,.8);backdrop-filter:blur(6px);
  position:sticky;top:0;z-index:20;
}
header .logo{font-size:20px}
.hSub{font-size:10px;color:var(--muted);letter-spacing:.28em;text-transform:uppercase;margin-top:2px}
.userBox{display:flex;align-items:center;gap:14px;font-size:14px}
.userName{color:var(--gold-bright);font-weight:500}
.miniBtn{
  background:none;border:1px solid var(--line);color:var(--muted);
  padding:6px 12px;border-radius:5px;cursor:pointer;font-family:'Rubik',sans-serif;
  font-size:13px;transition:border-color .2s,color .2s;
}
.miniBtn:hover{border-color:var(--gold);color:var(--gold-bright)}

main{flex:1;display:flex;flex-direction:column;align-items:center;padding:28px 16px 48px;gap:26px}

/* progress */
.stage{
  text-align:center;
}
.stageCount{
  font-family:'Cinzel',serif;font-weight:700;font-size:14px;letter-spacing:.3em;
  color:var(--muted);text-transform:uppercase;
}
.stageTarget{
  font-family:'Cinzel',serif;font-weight:900;font-size:26px;letter-spacing:.08em;
  color:var(--gold-bright);text-transform:uppercase;margin-top:4px;
}

/* ===== REEL ===== */
.reelWrap{
  position:relative;width:min(1100px,100%);
  border:1px solid var(--line);border-radius:10px;
  background:linear-gradient(180deg,#0d1320,#0a0e16);
  overflow:hidden;
  box-shadow:inset 0 0 60px rgba(0,0,0,.6);
}
.reelWrap::before,.reelWrap::after{
  content:"";position:absolute;top:0;bottom:0;width:120px;z-index:5;pointer-events:none;
}
.reelWrap::before{left:0;background:linear-gradient(90deg,var(--bg),transparent)}
.reelWrap::after{right:0;background:linear-gradient(270deg,var(--bg),transparent)}
.reel{
  display:flex;gap:10px;padding:22px 0;
  will-change:transform;
}
.card{
  flex:0 0 var(--cw);width:var(--cw);
  border-radius:8px;overflow:hidden;position:relative;
  background:var(--panel2);
  border:1px solid color-mix(in srgb, var(--rc) 45%, #222a3a);
  box-shadow:0 0 0 rgba(0,0,0,0);
}
.card img,.card .imgFallback{
  width:100%;aspect-ratio:1/1;object-fit:cover;display:block;
  filter:saturate(1.05);
}
.card .imgFallback{
  display:flex;align-items:center;justify-content:center;
  font-family:'Cinzel',serif;font-weight:900;font-size:42px;color:var(--rc);
  background:radial-gradient(circle at 50% 30%, color-mix(in srgb,var(--rc) 25%, #0c1220), #0a0e16);
}
.card .cname{
  padding:7px 4px;text-align:center;font-size:12px;font-weight:500;
  letter-spacing:.04em;color:var(--gold-bright);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  border-top:1px solid color-mix(in srgb, var(--rc) 35%, #1a2233);
  background:linear-gradient(180deg, color-mix(in srgb, var(--rc) 12%, #0d1320), #0b0f18);
}
.card::after{ /* hextech corner brackets */
  content:"";position:absolute;inset:4px;pointer-events:none;border-radius:5px;
  background:
    linear-gradient(var(--rc),var(--rc)) top left / 12px 2px,
    linear-gradient(var(--rc),var(--rc)) top left / 2px 12px,
    linear-gradient(var(--rc),var(--rc)) top right / 12px 2px,
    linear-gradient(var(--rc),var(--rc)) top right / 2px 12px,
    linear-gradient(var(--rc),var(--rc)) bottom left / 12px 2px,
    linear-gradient(var(--rc),var(--rc)) bottom left / 2px 12px,
    linear-gradient(var(--rc),var(--rc)) bottom right / 12px 2px,
    linear-gradient(var(--rc),var(--rc)) bottom right / 2px 12px;
  background-repeat:no-repeat;opacity:.55;
}
.card.pass{box-shadow:0 0 22px color-mix(in srgb, var(--rc) 55%, transparent)}
.card.winner{
  border-color:var(--rc);
  box-shadow:0 0 34px color-mix(in srgb, var(--rc) 80%, transparent), 0 0 90px color-mix(in srgb, var(--rc) 35%, transparent);
  animation:winnerPulse 1s ease-out;
}
.card.winner::after{opacity:1}
@keyframes winnerPulse{
  0%{transform:scale(1)} 35%{transform:scale(1.12)} 100%{transform:scale(1.06)}
}
.marker{
  position:absolute;top:0;bottom:0;left:50%;width:2px;transform:translateX(-1px);
  background:linear-gradient(180deg,transparent,var(--gold) 20%,var(--gold) 80%,transparent);
  z-index:6;pointer-events:none;
  box-shadow:0 0 12px rgba(200,170,110,.8);
}
.marker::before,.marker::after{
  content:"";position:absolute;left:50%;transform:translateX(-50%);
  border:8px solid transparent;
}
.marker::before{top:-2px;border-top:11px solid var(--gold)}
.marker::after{bottom:-2px;border-bottom:11px solid var(--gold)}

.reelWrap.shake{animation:shake .45s cubic-bezier(.36,.07,.19,.97)}
@keyframes shake{
  10%,90%{transform:translate3d(-2px,0,0)}
  20%,80%{transform:translate3d(3px,1px,0)}
  30%,50%,70%{transform:translate3d(-5px,-1px,0)}
  40%,60%{transform:translate3d(5px,1px,0)}
}

/* spin button */
.spinRow{display:flex;flex-direction:column;align-items:center;gap:10px}
#spinBtn{min-width:280px;font-size:18px;padding:16px 34px}
.soundHint{font-size:12px;color:var(--muted)}

/* announce banner */
#announce{
  position:fixed;inset:0;display:none;align-items:center;justify-content:center;
  z-index:40;pointer-events:none;
}
#announce .annText{
  font-family:'Cinzel',serif;font-weight:900;text-transform:uppercase;
  font-size:clamp(40px,9vw,110px);letter-spacing:.06em;color:var(--ac,#fff);
  text-shadow:0 0 40px color-mix(in srgb,var(--ac,#fff) 70%,transparent),0 4px 0 rgba(0,0,0,.5);
  animation:annPop 1.5s cubic-bezier(.2,1.4,.3,1) forwards;
}
@keyframes annPop{
  0%{opacity:0;transform:scale(.4)}
  18%{opacity:1;transform:scale(1.08)}
  30%{transform:scale(1)}
  80%{opacity:1}
  100%{opacity:0;transform:scale(1.04)}
}

/* particles */
.particle{
  position:fixed;width:8px;height:8px;border-radius:2px;z-index:39;pointer-events:none;
}

/* ===== DECKS ===== */
.decks{
  display:grid;grid-template-columns:repeat(3,1fr);gap:18px;width:min(1100px,100%);
}
.deck{
  background:var(--panel);border:1px solid var(--line);border-radius:10px;
  padding:16px;transition:border-color .3s, box-shadow .3s;
}
.deck h3{
  font-family:'Cinzel',serif;font-weight:700;font-size:15px;letter-spacing:.18em;
  text-transform:uppercase;color:var(--gold);text-align:center;margin-bottom:12px;
}
.slots{display:flex;gap:12px;justify-content:center}
.slot{
  width:104px;border-radius:8px;border:1px dashed var(--line);
  background:var(--panel2);overflow:hidden;position:relative;
  min-height:138px;display:flex;flex-direction:column;
  transition:border-color .3s, box-shadow .3s, transform .3s;
}
.slot .qm{
  flex:1;display:flex;align-items:center;justify-content:center;
  font-family:'Cinzel',serif;font-size:34px;color:#2e3850;font-weight:700;
}
.slot.filled{border-style:solid;border-color:color-mix(in srgb, var(--rc) 60%, #222a3a)}
.slot.filled img{width:100%;aspect-ratio:1/1;object-fit:cover;display:block}
.slot .sname{
  padding:6px 3px;text-align:center;font-size:11px;font-weight:500;color:var(--gold-bright);
  background:linear-gradient(180deg, color-mix(in srgb, var(--rc) 12%, #0d1320), #0b0f18);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.slot.target{
  border-color:var(--gold);border-style:solid;
  box-shadow:0 0 18px rgba(200,170,110,.35);
  animation:slotPulse 1.4s ease-in-out infinite;
}
@keyframes slotPulse{
  0%,100%{box-shadow:0 0 10px rgba(200,170,110,.25)}
  50%{box-shadow:0 0 24px rgba(200,170,110,.6)}
}
.slot.justFilled{animation:slotLand .5s cubic-bezier(.2,1.4,.3,1)}
@keyframes slotLand{0%{transform:scale(.6)}60%{transform:scale(1.08)}100%{transform:scale(1)}}

/* flying card */
.flyCard{
  position:fixed;z-index:38;border-radius:8px;overflow:hidden;pointer-events:none;
  border:1px solid var(--rc);box-shadow:0 0 30px color-mix(in srgb,var(--rc) 60%,transparent);
}
.flyCard img{width:100%;height:100%;object-fit:cover;display:block}

/* ===== FINALE ===== */
#finale{
  position:fixed;inset:0;display:none;align-items:center;justify-content:center;
  background:rgba(6,9,14,.92);backdrop-filter:blur(8px);z-index:50;padding:20px;
}
.finaleBox{width:min(900px,100%);text-align:center}
.finaleBox h2{
  font-family:'Cinzel',serif;font-weight:900;font-size:clamp(28px,5vw,52px);
  letter-spacing:.08em;text-transform:uppercase;
  background:linear-gradient(180deg,#f0e6d2,#c8aa6e 60%,#8a6d3b);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  margin-bottom:26px;
}
.finaleDecks{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:30px}
.fDeck{
  background:var(--panel);border:1px solid var(--gold);border-radius:10px;padding:14px;
  opacity:0;transform:translateY(24px);
  animation:fIn .6s cubic-bezier(.2,1.2,.3,1) forwards;
}
.fDeck:nth-child(2){animation-delay:.25s}
.fDeck:nth-child(3){animation-delay:.5s}
@keyframes fIn{to{opacity:1;transform:translateY(0)}}
.fDeck h3{font-family:'Cinzel',serif;color:var(--gold);letter-spacing:.15em;font-size:14px;text-transform:uppercase;margin-bottom:10px}
.fPair{display:flex;gap:10px;justify-content:center}
.fCh{width:96px}
.fCh img{width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:6px;border:1px solid var(--rc);box-shadow:0 0 16px color-mix(in srgb,var(--rc) 40%,transparent)}
.fCh div{font-size:12px;margin-top:5px;color:var(--gold-bright)}

.draftRow{
  display:flex;gap:18px;align-items:stretch;justify-content:center;flex-wrap:wrap;width:min(1100px,100%);
}
.poolStats{
  display:flex;flex-direction:column;justify-content:center;gap:12px;
  background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px 26px;
}
.poolStats div{display:flex;align-items:baseline;gap:10px}
.poolStats span{
  font-family:'Cinzel',serif;font-weight:900;font-size:26px;color:var(--gold-bright);min-width:52px;text-align:right;
}
.poolStats label{font-size:12px;color:var(--muted);letter-spacing:.12em;text-transform:uppercase}
.historyWrap{width:min(1100px,100%)}
.historyWrap h3{
  font-family:'Cinzel',serif;font-weight:700;font-size:14px;letter-spacing:.22em;
  text-transform:uppercase;color:var(--muted);margin-bottom:12px;text-align:center;
}
.history{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.tierCells:empty::after{
  content:"";flex:1;
}
.tabs{display:flex;gap:10px;justify-content:center;width:min(1100px,100%)}
.tabBtn{
  background:var(--panel);border:1px solid var(--line);color:var(--muted);
  padding:9px 22px;border-radius:7px;cursor:pointer;
  font-family:'Cinzel',serif;font-weight:700;font-size:14px;letter-spacing:.1em;text-transform:uppercase;
  transition:border-color .2s,color .2s,box-shadow .2s;
}
.tabBtn:hover{border-color:var(--gold)}
.tabBtn.active{
  color:var(--gold-bright);border-color:var(--gold);
  box-shadow:0 0 14px rgba(200,170,110,.25);
}
.tabPage{display:flex;flex-direction:column;align-items:center;gap:26px;width:100%}
.cChip{
  width:46px;height:46px;border-radius:7px;overflow:hidden;cursor:grab;position:relative;
  border:1px solid color-mix(in srgb, var(--rc) 55%, #222a3a);
  background:#0c1220;user-select:none;
  transition:border-color .15s, box-shadow .15s, transform .15s;
}
.cChip img{width:100%;height:100%;object-fit:cover;display:block}
.cChip .hFallback{
  width:100%;height:100%;display:flex;align-items:center;justify-content:center;
  font-family:'Cinzel',serif;font-weight:900;font-size:18px;color:var(--rc);
}
.cChip:hover{border-color:var(--gold)}
.cChip.insertBefore{box-shadow:-4px 0 0 var(--gold)}
.cChip.selected{
  border-color:var(--gold);box-shadow:0 0 12px rgba(200,170,110,.5);transform:scale(1.1);z-index:2;
}
.tierBoard{display:flex;flex-direction:column;gap:8px}
.tierRow{
  display:flex;align-items:stretch;border:1px solid var(--line);border-radius:9px;
  overflow:hidden;background:var(--panel);transition:border-color .2s, box-shadow .2s;
}
.tierRow.dropReady{border-color:var(--gold);box-shadow:0 0 14px rgba(200,170,110,.3)}
.tierLabel{
  width:64px;flex:0 0 64px;display:flex;align-items:center;justify-content:center;
  font-family:'Cinzel',serif;font-weight:900;font-size:20px;color:#0b0e14;
  background:var(--tc);cursor:pointer;user-select:none;
}
.tierRow.unranked .tierLabel{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.tierCells{flex:1;display:flex;flex-wrap:wrap;gap:8px;padding:8px;min-height:54px}
.tDeck{
  display:flex;align-items:center;gap:7px;background:var(--panel2);
  border:1px solid var(--line);border-radius:7px;padding:4px 9px;cursor:grab;
  user-select:none;transition:border-color .15s, box-shadow .15s, transform .15s;
}
.tDeck:hover{border-color:var(--gold)}
.tDeck.selected{
  border-color:var(--gold);box-shadow:0 0 12px rgba(200,170,110,.45);transform:scale(1.04);
}
.tDeck .hn{font-family:'Cinzel',serif;font-weight:700;font-size:12px;color:var(--gold);min-width:20px;text-align:center}
.tDeck img,.tDeck .hFallback{
  width:30px;height:30px;border-radius:5px;object-fit:cover;
  border:1px solid color-mix(in srgb, var(--rc) 55%, #222a3a);
}
.tDeck .hFallback{
  display:flex;align-items:center;justify-content:center;font-family:'Cinzel',serif;
  font-weight:900;font-size:14px;color:var(--rc);background:#0c1220;
}
.tDeck .tNames{font-size:11.5px;color:var(--text);line-height:1.3;min-width:0;white-space:nowrap}
.tierHint{margin-top:8px;text-align:center;font-size:11.5px;color:#39415a}
.hDeck{
  background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:10px 12px;
  display:flex;align-items:center;gap:10px;
}
.hDeck .hn{
  font-family:'Cinzel',serif;font-weight:700;font-size:13px;color:var(--gold);min-width:26px;text-align:center;
}
.hDeck img,.hDeck .hFallback{
  width:40px;height:40px;border-radius:6px;object-fit:cover;border:1px solid color-mix(in srgb, var(--rc) 55%, #222a3a);
}
.hDeck .hFallback{
  display:flex;align-items:center;justify-content:center;font-family:'Cinzel',serif;
  font-weight:900;color:var(--rc);background:#0c1220;
}
.hDeck .hNames{font-size:12.5px;color:var(--text);line-height:1.35;min-width:0}
.hDeck .hNames div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

@media (prefers-reduced-motion: reduce){
  .reelWrap.shake,#announce .annText,.slot.target,.slot.justFilled,.card.winner{animation:none}
}
@media (max-width:820px){
  .finaleDecks{grid-template-columns:1fr}
  .draftRow{flex-direction:column;align-items:center}
  .poolStats{flex-direction:row;gap:22px;padding:12px 18px}
  .slots{justify-content:center}
  header{padding:12px 14px}
  header .logo{font-size:16px}
}
</style>
</head>
<body>

<div id="loginScreen">
  <div class="loginBox">
    <div class="logo">Runeterra<br>Rumble</div>
    <div class="logoSub">powered by Storyteller</div>
    <form id="loginForm">
      <div>
        <label for="loginUser">Username</label>
        <input id="loginUser" autocomplete="username" required>
      </div>
      <div>
        <label for="loginPass">Password</label>
        <input id="loginPass" type="password" autocomplete="current-password" required>
      </div>
      <div class="loginErr" id="loginErr"></div>
      <button class="btnGold" type="submit">Sign in</button>
    </form>
  </div>
</div>

<div id="app">
  <header>
    <div class="hLogo">
      <div class="logo">Runeterra Rumble</div>
      <div class="hSub">powered by Storyteller</div>
    </div>
    <div class="userBox">
      <span class="userName" id="userLabel"></span>
      <button class="miniBtn" id="soundBtn" title="Sound">🔊</button>
      <button class="miniBtn" id="resetBtn">Reset</button>
      <button class="miniBtn" id="logoutBtn">Sign out</button>
    </div>
  </header>
  <main>
    <div class="tabs">
      <button class="tabBtn active" id="tabBtnDraft">Draft</button>
      <button class="tabBtn" id="tabBtnChamps">A-Z tier list</button>
    </div>
    <div class="tabPage" id="tabDraft">
    <div class="stage">
      <div class="stageCount" id="stageCount"></div>
      <div class="stageTarget" id="stageTarget"></div>
    </div>

    <div class="reelWrap" id="reelWrap">
      <div class="reel" id="reel"></div>
      <div class="marker"></div>
    </div>

    <div class="spinRow">
      <button class="btnGold" id="spinBtn">Spin</button>
    </div>

    <div class="draftRow">
      <div class="deck" id="currentDeck">
        <h3 id="currentDeckTitle">Deck 1</h3>
        <div class="slots">
          <div class="slot" data-slot="0"><div class="qm">?</div></div>
          <div class="slot" data-slot="1"><div class="qm">?</div></div>
        </div>
      </div>
      <div class="poolStats">
        <div><span id="statRemaining">0</span><label>in the pool</label></div>
        <div><span id="statUsed">0</span><label>drafted</label></div>
        <div><span id="statDecks">0</span><label>decks</label></div>
      </div>

/* ================= AUDIO ================= */
let audioCtx = null, master = null, noiseBuf = null, riserNodes = [];
function ac(){
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const comp = audioCtx.createDynamicsCompressor();
    comp.threshold.value = -14; comp.ratio.value = 5; comp.attack.value = 0.002; comp.release.value = 0.2;
    master = audioCtx.createGain();
    master.gain.value = 0.9;
    master.connect(comp).connect(audioCtx.destination);
    const len = audioCtx.sampleRate * 2;
    noiseBuf = audioCtx.createBuffer(1, len, audioCtx.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
  }
  if (audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}
function noise(){ const s = audioCtx.createBufferSource(); s.buffer = noiseBuf; return s; }
/* helpers */
function tone(type, f0, f1, t, dur, peak, attack = 0.002, dest = master){
  const o = audioCtx.createOscillator(), g = audioCtx.createGain();
  o.type = type;
  o.frequency.setValueAtTime(f0, t);
  if (f1 && f1 !== f0) o.frequency.exponentialRampToValueAtTime(f1, t + dur);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(peak, t + attack);
  g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g).connect(dest);
  o.start(t); o.stop(t + dur + 0.05);
  return o;
}
function noiseHit(filterType, f0, f1, t, dur, peak, Q = 1, dest = master){
  const s = noise();
  const f = audioCtx.createBiquadFilter();
  f.type = filterType; f.Q.value = Q;
  f.frequency.setValueAtTime(f0, t);
  if (f1 && f1 !== f0) f.frequency.exponentialRampToValueAtTime(f1, t + dur);
  const g = audioCtx.createGain();
  g.gain.setValueAtTime(peak, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  s.connect(f).connect(g).connect(dest);
  s.start(t); s.stop(t + dur + 0.05);
  return s;
}
function distortion(amount){
  const ws = audioCtx.createWaveShaper();
  const n = 512, curve = new Float32Array(n);
  for (let i = 0; i < n; i++) { const x = (i / (n - 1)) * 2 - 1; curve[i] = Math.tanh(amount * x); }
  ws.curve = curve;
  return ws;
}

/* ===== Spin sounds: heartbeat ticks + growing rumble (locked in) ===== */
function tickSpin(sp){ const t = audioCtx.currentTime;
  tone('sine', 72, 48, t, 0.09, 0.5);
}
function riserSpin(sec){ const t = audioCtx.currentTime;
  const s = noise(); s.loop = true;
  const f = audioCtx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 130;
  const g = audioCtx.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(0.22, t + sec * 0.95);
  g.gain.exponentialRampToValueAtTime(0.0001, t + sec + 0.1);
  s.connect(f).connect(g).connect(master);
  s.start(t); s.stop(t + sec + 0.2);
  riserNodes = [s];
}

/* ===== Landing sound: bass drop (locked in) ===== */
function landSpin(){ const t = audioCtx.currentTime;
  noiseHit('highpass', 1500, null, t, 0.03, 0.3);
  const dist = distortion(2.5);
  dist.connect(master);
  tone('sine', 85, 38, t, 1.0, 0.95, 0.003, dist);
  noiseHit('highpass', 6000, 300, t, 0.6, 0.12);
  tone('sine', 60, 40, t + 0.45, 0.55, 0.4, 0.005, dist);
}

function playTick(sp){ if (!soundOn) return; ac(); tickSpin(sp); }
function playLand(){ if (!soundOn) return; ac(); landSpin(); }
function startRiser(dur){ if (!soundOn) return; ac(); riserSpin(dur / 1000); }

/* ================= SPIN ================= */
/* Carousel: each remaining champion appears exactly once per revolution.
   The strip is repeated back to back only so the wrap-around is seamless. */
function buildReel(winner, wrapWidth, step){
  const reel = $('reel');
  reel.innerHTML = '';
  seq = shuffle([...poolNow()]);
  const seqW = seq.length * step;
  const copies = Math.max(2, Math.ceil(wrapWidth / seqW) + 1);
  for (let copy = 0; copy < copies; copy++) seq.forEach(ch => reel.appendChild(cardEl(ch)));
  return seq.indexOf(winner);
}

function startSpin(){
  if (pendingDeck) { nextDeck(); return; }
  if (spinning || poolNow().length === 0) return;
  spinning = true;
  renderStage();
  if (soundOn) ac();

  const pool = poolNow();
  const winner = pool[Math.floor(Math.random() * pool.length)];
  const reel = $('reel');
  const wrap = $('reelWrap');
  const cw = cardWidth(), gap = 10, step = cw + gap;

  const wIdx = buildReel(winner, wrap.clientWidth, step);
  const seqW = seq.length * step;
  const jitter = reduceMotion ? 0 : (Math.random() * 0.7 - 0.35) * Math.min(cw, seqW / 3);
  let base = wIdx * step + cw / 2 - wrap.clientWidth / 2 + jitter;
  base = ((base % seqW) + seqW) % seqW;

  const dur = reduceMotion ? 700 : SPIN_MS;
  const revs = reduceMotion ? 1 : REVOLUTIONS;
  const total = revs * seqW + base;
  const ease = t => 1 - Math.pow(1 - t, 5);

  startRiser(dur);

  let lastIdx = -1;
  const t0 = performance.now();
  function frame(now){
    const t = Math.min(1, (now - t0) / dur);
    const x = total * ease(t);
    const xm = x % seqW;
    reel.style.transform = `translateX(${-xm}px)`;
    const idx = Math.floor((x + wrap.clientWidth / 2) / step);
    if (idx !== lastIdx) {
      playTick(1 - t);
      const domIdx = Math.floor((xm + wrap.clientWidth / 2) / step);
      const el = reel.children[domIdx];
      if (el) {
        el.classList.add('pass');
        setTimeout(() => el.classList.remove('pass'), 180);
      }
      lastIdx = idx;
    }
    if (t < 1) {
      requestAnimationFrame(frame);
    } else {
      const domIdx = Math.round((xm + wrap.clientWidth / 2 - cw / 2) / step);
      const winEl = reel.children[domIdx] || reel.children[wIdx];
      stopRiser();
      land(winner, winEl);
    }
  }
  requestAnimationFrame(frame);
}

function land(winner, winEl){
  spinning = false;
  winEl.classList.add('winner');
  playLand();
  if (!reduceMotion) {
    $('reelWrap').classList.add('shake');
    setTimeout(() => $('reelWrap').classList.remove('shake'), 500);
    burst(winEl, winner.color);
  }
  announce(winner);

  const slotIdx = state.current.length;

  const finish = () => {
    state.current.push(winner.name);
    const deckDone = state.current.length === 2 || poolNow().length === 0;
    if (deckDone) {
      pendingDeck = [...state.current];
      state.decks.push([...state.current]);
      state.used.push(...state.current);
      state.current = [];
    }
    saveState();
    renderAll();
    if (deckDone) {
      setTimeout(() => showDeckDone(state.decks[state.decks.length - 1]), 900);
    } else {
      const s = document.querySelector(`#currentDeck .slot[data-slot="${slotIdx}"]`);
      if (s) s.classList.add('justFilled');
    }
  };
  if (reduceMotion) { finish(); }
  else { flyToSlot(winEl, winner, slotIdx, finish); }
}

function announce(ch){
  const a = $('announce'), t = $('annText');
  t.textContent = ch.name;
  a.style.setProperty('--ac', ch.color);
  a.style.display = 'flex';
  t.style.animation = 'none';
  void t.offsetWidth;
  t.style.animation = '';
  setTimeout(() => { a.style.display = 'none'; }, 1500);
}

function burst(el, color){
  const r = el.getBoundingClientRect();
  const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
  for (let i = 0; i < 26; i++) {
    const p = document.createElement('div');
    p.className = 'particle';
    p.style.background = Math.random() < 0.4 ? '#c8aa6e' : color;
    p.style.left = cx + 'px'; p.style.top = cy + 'px';
    document.body.appendChild(p);
    const ang = Math.random() * Math.PI * 2;
    const v = 120 + Math.random() * 240;
    p.animate([
      {transform:'translate(0,0) rotate(0deg)', opacity:1},
      {transform:`translate(${Math.cos(ang)*v}px, ${Math.sin(ang)*v + 80}px) rotate(${Math.random()*540-270}deg)`, opacity:0}
    ], {duration: 800 + Math.random() * 500, easing:'cubic-bezier(.2,.8,.4,1)'}).onfinish = () => p.remove();
  }
}

function flyToSlot(winEl, ch, slotIdx, done){
  const src = winEl.querySelector('img, .imgFallback');
  const from = (src || winEl).getBoundingClientRect();
  const slotEl = document.querySelector(`#currentDeck .slot[data-slot="${slotIdx}"]`);
  const to = slotEl ? slotEl.getBoundingClientRect() : from;
  const fly = document.createElement('div');
  fly.className = 'flyCard';
  fly.style.setProperty('--rc', ch.color);
  fly.style.left = from.left + 'px'; fly.style.top = from.top + 'px';
  fly.style.width = from.width + 'px'; fly.style.height = from.height + 'px';
  fly.appendChild(champImg(ch, 'hFallback'));
  document.body.appendChild(fly);
  fly.animate([
    {left: from.left+'px', top: from.top+'px', width: from.width+'px', height: from.height+'px', offset: 0},
    {left: to.left+'px', top: to.top+'px', width: to.width+'px', height: to.width+'px', offset: 1}
  ], {duration: 650, delay: 550, easing:'cubic-bezier(.3,.9,.2,1)', fill:'forwards'}).onfinish = () => {
    fly.remove();
    done();
  };
}

/* ================= DECK DONE / RESET ================= */
function showDeckDone(pair){
  $('finaleTitle').textContent = 'Deck ' + state.decks.length + ' complete';
  const wrap = $('finaleDecks');
  wrap.innerHTML = '';
  const d = document.createElement('div');
  d.className = 'fDeck';
  d.style.gridColumn = '1 / -1';
  const p = document.createElement('div');
  p.className = 'fPair';
  pair.forEach(name => {
    const ch = byName[name];
    const c = document.createElement('div');
    c.className = 'fCh';
    c.style.setProperty('--rc', ch.color);
    const n = document.createElement('div');
    n.textContent = ch.name;
    c.append(champImg(ch, 'hFallback'), n);
    p.appendChild(c);
  });
  d.appendChild(p);
  wrap.appendChild(d);
  $('againBtn').textContent = poolNow().length === 0 ? 'Close' : 'Draft next deck';
  $('finale').style.display = 'flex';
}

function nextDeck(){
  pendingDeck = null;
  $('finale').style.display = 'none';
  fillReelIdle();
  renderAll();
}
$('againBtn').addEventListener('click', nextDeck);

$('resetBtn').addEventListener('click', () => {
  if (spinning) return;
  if (!confirm('Reset this account? All drafted decks are deleted and every champion returns to the pool.')) return;
  state = { used: [], decks: [], current: [], tiers: {}, champTiers: { S:[], A:[], B:[], C:[], D:[] } };
  pendingDeck = null;
  saveState();
  $('finale').style.display = 'none';
  fillReelIdle();
  renderAll();
  renderChampBoard();
});

/* ================= CHAMPION TIER LIST ================= */
let selectedChamp = null;

/* older saves stored { name: tier }; convert to ordered lists per tier */
function migrateChampTiers(){
  const ct = state.champTiers;
  const fresh = { S:[], A:[], B:[], C:[], D:[] };
  if (!ct) { state.champTiers = fresh; return; }
  if (Array.isArray(ct.S)) {
    Object.keys(fresh).forEach(t => { if (!Array.isArray(ct[t])) ct[t] = []; });
    return;
  }
  Object.entries(ct).forEach(([name, t]) => { if (fresh[t]) fresh[t].push(name); });
  Object.keys(fresh).forEach(t => fresh[t].sort((x, y) => x.localeCompare(y, 'en')));
  state.champTiers = fresh;
}

function removeChampEverywhere(name){
  TIERS.forEach(([t]) => {
    const arr = state.champTiers[t];
    const i = arr.indexOf(name);
    if (i > -1) arr.splice(i, 1);
  });
}

/* place a champion into a tier, optionally right before another champion */
function placeChamp(name, tier, beforeName){
  if (!name) return;
  removeChampEverywhere(name);
  if (tier) {
    const arr = state.champTiers[tier];
    const i = beforeName ? arr.indexOf(beforeName) : -1;
    if (i > -1) arr.splice(i, 0, name);
    else arr.push(name);
  }
  selectedChamp = null;
  saveState();
  renderChampBoard();
}

function champChipEl(ch, tierKey){
  const d = document.createElement('div');
  d.className = 'cChip' + (selectedChamp === ch.name ? ' selected' : '');
  d.style.setProperty('--rc', ch.color);
  d.title = ch.name;
  d.draggable = true;
  d.dataset.name = ch.name;
  const img = champImg(ch, 'hFallback');
  img.loading = 'lazy';
  d.appendChild(img);
  d.addEventListener('click', e => {
    e.stopPropagation();
    if (selectedChamp && selectedChamp !== ch.name && tierKey) {
      placeChamp(selectedChamp, tierKey, ch.name);
      return;
    }
    selectedChamp = selectedChamp === ch.name ? null : ch.name;
    renderChampBoard();
  });
  d.addEventListener('dragstart', e => {
    e.dataTransfer.setData('text/plain', 'c:' + ch.name);
    e.dataTransfer.effectAllowed = 'move';
  });
  if (tierKey) {
    d.addEventListener('dragover', e => { e.preventDefault(); e.stopPropagation(); d.classList.add('insertBefore'); });
    d.addEventListener('dragleave', () => d.classList.remove('insertBefore'));
    d.addEventListener('drop', e => {
      e.preventDefault(); e.stopPropagation();
      d.classList.remove('insertBefore');
      const data = e.dataTransfer.getData('text/plain');
      if (data && data.startsWith('c:') && data.slice(2) !== ch.name) placeChamp(data.slice(2), tierKey, ch.name);
    });
  }
  return d;
}

function champTierRow(label, color, tierKey, champsHere){
  const row = document.createElement('div');
  row.className = 'tierRow' + (tierKey ? '' : ' unranked');
  const lab = document.createElement('div');
  lab.className = 'tierLabel';
  lab.style.background = color;
  lab.textContent = label;
  const cells = document.createElement('div');
  cells.className = 'tierCells';
  champsHere.forEach(ch => cells.appendChild(champChipEl(ch, tierKey)));
  row.append(lab, cells);
  row.addEventListener('click', () => { if (selectedChamp !== null) placeChamp(selectedChamp, tierKey, null); });
  row.addEventListener('dragover', e => { e.preventDefault(); row.classList.add('dropReady'); });
  row.addEventListener('dragleave', () => row.classList.remove('dropReady'));
  row.addEventListener('drop', e => {
    e.preventDefault();
    row.classList.remove('dropReady');
    const data = e.dataTransfer.getData('text/plain');
    if (data && data.startsWith('c:')) placeChamp(data.slice(2), tierKey, null);
  });
  return row;
}

function renderChampBoard(){
  const board = $('champBoard');
  board.innerHTML = '';
  const ranked = new Set();
  TIERS.forEach(([t]) => state.champTiers[t].forEach(n => ranked.add(n)));
  const unranked = [...CHAMPIONS]
    .filter(ch => !ranked.has(ch.name))
    .sort((x, y) => x.name.localeCompare(y.name, 'en'));
  board.appendChild(champTierRow('', '#2a3244', null, unranked));
  TIERS.forEach(([t, color]) => {
    const champs = state.champTiers[t].map(n => byName[n]).filter(Boolean);
    board.appendChild(champTierRow(t, color, t, champs));
  });
}

/* ================= TABS ================= */
function showTab(which){
  const draft = which === 'draft';
  $('tabDraft').style.display = draft ? 'flex' : 'none';
  $('tabChamps').style.display = draft ? 'none' : 'flex';
  $('tabBtnDraft').classList.toggle('active', draft);
  $('tabBtnChamps').classList.toggle('active', !draft);
  if (!draft) renderChampBoard();
}
$('tabBtnDraft').addEventListener('click', () => showTab('draft'));
$('tabBtnChamps').addEventListener('click', () => showTab('champs'));

/* Dev check: compares the pool against Data Dragon (all collectible Champion cards).
   Open the browser console on the deployed site and run: verifyPool() */
async function verifyPool(){
  const sets = ['set1','set2','set3','set4','set5','set6','set6cde','set7','set7b','set8','set9'];
  const found = new Set();
  for (const st of sets) {
    try {
      const res = await fetch(`https://dd.b.pvp.net/latest/${st}/en_us/data/${st}-en_us.json`);
      if (!res.ok) { console.warn(st, 'HTTP', res.status); continue; }
      const cards = await res.json();
      cards.forEach(c => { if (c.rarityRef === 'Champion' && c.collectible) found.add(c.name); });
      console.log(st, 'ok');
    } catch(err) { console.warn(st, 'failed', err); }
  }
  const mine = new Set(CHAMPIONS.map(c => c.name));
  const missing = [...found].filter(n => !mine.has(n)).sort();
  const extra = [...mine].filter(n => !found.has(n)).sort();
  console.log(`Data Dragon collectible champions: ${found.size} | in pool: ${mine.size}`);
  console.log('Missing from pool:', missing.length ? missing : 'none');
  console.log('In pool but not in Data Dragon:', extra.length ? extra : 'none');
  return { missing, extra };
}

$('spinBtn').addEventListener('click', startSpin);
